<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open QR — ডিজিটাল প্রোফাইল</title>
<meta name="description" content="Open QR দিয়ে বানানো একটি স্মার্ট ডিজিটাল ব্যবসায়িক প্রোফাইল">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#241A15;--cream:#FBF7EE;--paper:#FFFFFF;--maroon:#7A2323;--maroon-deep:#4A1414;--gold:#E0A527;--teal:#2F6F5E;--line:rgba(36,26,21,0.09);--shadow:0 10px 30px -12px rgba(74,20,20,0.18);}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--ink);font-family:'Hind Siliguri',sans-serif;padding:0 0 60px;}
#root{width:100%;}
.app{width:100%;max-width:430px;margin:0 auto;background:var(--cream);min-height:100vh;position:relative;overflow-x:clip;}
.state-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:30px;text-align:center;}
.state-screen .emoji{font-size:44px;}
.state-screen p{font-size:13.5px;color:#7a6c60;line-height:1.7;}
.state-screen a{font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;color:var(--maroon);text-decoration:none;border:1px solid var(--line);padding:10px 18px;border-radius:100px;}
.ticker{background:var(--maroon-deep);color:var(--gold);overflow:hidden;white-space:nowrap;padding:7px 0;font-family:'Poppins',sans-serif;font-size:11px;font-weight:500;}
.ticker-track{display:inline-block;padding-left:100%;animation:ticker-scroll 22s linear infinite;}
.ticker-track span{margin-right:36px;}
@keyframes ticker-scroll{from{transform:translateX(0);}to{transform:translateX(-100%);}}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease;}
.reveal.in{opacity:1;transform:translateY(0);}
.hero{position:relative;background:radial-gradient(140% 120% at 15% -20%,var(--maroon) 0%,var(--maroon-deep) 65%);padding:34px 22px 64px;color:#fff;overflow:hidden;isolation:isolate;text-align:center;}
.hero-pattern{position:absolute;inset:0;z-index:-1;opacity:.14;background-image:radial-gradient(circle,#fff 1.6px,transparent 1.6px);background-size:22px 22px;}
.logo-img{width:56px;height:56px;border-radius:16px;object-fit:cover;margin:0 auto 12px;display:block;box-shadow:0 10px 22px -8px rgba(0,0,0,.4);background:transparent;}
.hero-top{display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.wheel{width:34px;height:34px;flex:none;animation:spin 7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;}
.eyebrow{font-family:'Poppins',sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);background:rgba(255,255,255,0.08);padding:5px 10px;border-radius:100px;border:1px solid rgba(255,255,255,0.16);}
.status-pill{font-family:'Poppins',sans-serif;font-size:10.5px;font-weight:600;padding:5px 10px;border-radius:100px;display:inline-flex;align-items:center;gap:5px;}
.status-pill.open{background:rgba(60,180,120,.18);color:#8FE3B8;border:1px solid rgba(143,227,184,.35);}
.status-pill.closed{background:rgba(255,255,255,.1);color:#EFDFC9;border:1px solid rgba(255,255,255,.2);}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
h1{font-family:'Baloo Da 2',sans-serif;font-weight:800;font-size:32px;line-height:1.1;letter-spacing:-.01em;}
.tagline{margin-top:9px;font-size:13.5px;color:#EFDFC9;max-width:88%;margin-left:auto;margin-right:auto;line-height:1.6;}
.info-card{position:relative;margin:-40px 18px 0;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);display:flex;overflow:hidden;z-index:3;}
.info-card a{flex:1;text-align:center;padding:14px 4px 12px;font-size:10.5px;color:var(--ink);text-decoration:none;border-right:1px solid var(--line);font-family:'Hind Siliguri',sans-serif;}
.info-card>:last-child{border-right:none;}
.info-card .ic{font-size:17px;display:block;margin-bottom:4px;}
.quickpay-card{margin:14px 18px 0;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px 14px;}
.quickpay-title{font-family:'Baloo Da 2',sans-serif;font-weight:700;font-size:15.5px;color:var(--maroon);margin-bottom:2px;display:flex;align-items:center;gap:7px;}
.quickpay-sub{font-size:11.5px;color:#7a6c60;margin-bottom:8px;}
.search-wrap{padding:16px 16px 0;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow);}
.search-box input{border:none;outline:none;flex:1;font-family:'Hind Siliguri',sans-serif;font-size:13.5px;background:transparent;color:var(--ink);}
.search-box input::placeholder{color:#a89a8c;}
.search-clear{display:none;border:none;background:var(--cream);color:var(--maroon);width:20px;height:20px;border-radius:50%;font-size:12px;cursor:pointer;}
.search-clear.show{display:block;}
.no-results{display:none;text-align:center;padding:24px 16px;color:#a89a8c;font-size:13px;}
.no-results.show{display:block;}
.nav-wrap{position:sticky;top:0;z-index:20;background:rgba(251,247,238,0.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:14px;border-bottom:1px solid var(--line);}
.tabs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:none;font-family:'Poppins',sans-serif;font-size:12px;font-weight:500;padding:9px 14px;border-radius:100px;background:var(--paper);color:var(--maroon);white-space:nowrap;border:1px solid var(--line);text-decoration:none;cursor:pointer;transition:background .25s ease,color .25s ease,border-color .25s ease,transform .15s ease;}
.tab:active{transform:scale(.96);}
.tab.active{background:var(--maroon);color:#fff;border-color:var(--maroon);box-shadow:0 6px 14px -6px rgba(122,35,35,0.55);}
.section-card{background:var(--paper);margin:16px 16px 0;border-radius:18px;padding:18px 18px 6px;box-shadow:var(--shadow);scroll-margin-top:74px;}
.section-card.hidden{display:none;}
.section-title{font-family:'Baloo Da 2',sans-serif;font-weight:700;font-size:18px;color:var(--maroon);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:none;}
.item:nth-child(even){background:rgba(122,35,35,0.025);margin:0 -18px;padding-left:18px;padding-right:18px;border-radius:8px;}
.item.hidden{display:none;}
.item-name{font-weight:500;font-size:14.5px;flex:1;}
.item-price{font-family:'Poppins',sans-serif;font-weight:600;font-size:14px;color:var(--maroon);white-space:nowrap;background:rgba(122,35,35,0.08);padding:3px 9px;border-radius:100px;}
.item-check{width:21px;height:21px;flex:none;border:2px solid var(--maroon);border-radius:7px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;color:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s ease,color .15s ease;}
.item-check.checked{background:var(--maroon);color:#fff;}
.item.checked{background:rgba(122,35,35,0.06);border-radius:8px;}
.card-gold{background:linear-gradient(150deg,var(--gold),#C9860F);color:#fff;}
.card-gold .section-title{color:#fff;}
.row-flex{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,.28);}
.row-flex:last-child{border-bottom:none;}
.card-maroon{background:linear-gradient(150deg,var(--maroon),var(--maroon-deep));color:#fff;}
.card-maroon .section-title{color:var(--gold);}
.card-teal{background:linear-gradient(150deg,var(--teal),#1D4B3F);color:#fff;}
.card-teal .section-title{color:#fff;}
.row-plain{font-size:13px;padding:6px 0;line-height:1.55;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.live-tag{font-size:9.5px;background:var(--gold);color:var(--maroon-deep);padding:1px 7px;border-radius:100px;font-weight:700;font-family:'Poppins',sans-serif;}
.review-card{border-bottom:1px solid var(--line);padding:12px 0;}
.review-card:last-child{border-bottom:none;padding-bottom:16px;}
.review-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.review-name{font-weight:600;font-size:13.5px;}
.review-stars{color:var(--gold);font-size:12px;letter-spacing:1px;}
.review-text{font-size:12.5px;color:#5a4c40;line-height:1.6;}
.booking-p{font-size:13px;line-height:1.7;color:#4a3d33;margin-bottom:14px;}
.booking-btn{display:block;text-align:center;font-family:'Poppins',sans-serif;font-weight:600;font-size:13.5px;background:var(--teal);color:#fff;padding:13px;border-radius:14px;text-decoration:none;}
.pay-grid{display:flex;gap:8px;margin-top:6px;}
.pay-card{flex:1;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.pay-card .dot{width:14px;height:14px;border-radius:50%;margin:0 auto 6px;}
.pay-card b{font-size:11.5px;display:block;margin-bottom:3px;}
.pay-card span{font-size:10.5px;color:#7a6c60;}
.pay-hint{font-size:9.5px;color:#a89a8c;margin-top:6px;text-align:center;}
.about-p{font-size:13px;line-height:1.75;margin-bottom:10px;color:#4a3d33;}
.why-grid{display:flex;flex-direction:column;gap:7px;padding-bottom:16px;}
.why-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;}
.why-row .tick{color:var(--teal);font-weight:700;flex:none;}
footer{padding:26px 18px 90px;}
.cta-row{display:flex;gap:10px;margin-bottom:16px;}
.cta{flex:1;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;text-align:center;padding:13px 8px;border-radius:14px;text-decoration:none;border:none;cursor:pointer;}
.cta.primary{background:var(--maroon);color:#fff;box-shadow:0 10px 20px -10px rgba(122,35,35,.6);}
.cta.secondary{background:var(--paper);color:var(--maroon);border:1px solid var(--line);}
.cta-row2{display:flex;gap:10px;margin-bottom:16px;}
.qr-box{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);}
.qr-box img{width:68px;height:68px;border-radius:10px;}
.qr-text{font-size:11px;color:#7a6c60;line-height:1.5;}
.qr-text b{color:var(--ink);display:block;font-size:12.5px;margin-bottom:2px;}
.powered{text-align:center;margin-top:20px;font-family:'Poppins',sans-serif;font-size:10px;color:#a89a8c;line-height:1.7;}
.powered b{color:var(--maroon);font-size:11px;}
.spacer{height:14px;}
.fab-col{position:fixed;right:18px;bottom:22px;display:flex;flex-direction:column;gap:10px;z-index:40;align-items:flex-end;}
.fab{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none;box-shadow:0 12px 24px -8px rgba(0,0,0,.35);border:none;cursor:pointer;}
.fab.call{background:var(--maroon);color:#fff;}
.fab.wa{background:#25D366;color:#fff;}
.fab.top{width:40px;height:40px;background:var(--paper);color:var(--maroon);border:1px solid var(--line);font-size:16px;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .25s ease,transform .25s ease;}
.fab.top.show{opacity:1;pointer-events:auto;transform:translateY(0);}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-family:'Poppins',sans-serif;font-size:12.5px;padding:10px 18px;border-radius:100px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:50;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.order-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(140%);width:calc(100% - 32px);max-width:398px;background:var(--maroon-deep);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 18px 34px -12px rgba(74,20,20,0.6);z-index:46;transition:transform .3s ease;font-family:'Poppins',sans-serif;}
.order-bar.show{transform:translateX(-50%) translateY(0);}
.order-bar-info{font-size:11.5px;color:#EFDFC9;line-height:1.5;}
.order-bar-info b{font-size:14px;display:block;color:#fff;font-family:'Baloo Da 2',sans-serif;}
.order-bar button{flex:none;font-family:'Poppins',sans-serif;font-weight:700;font-size:12.5px;background:var(--gold);color:var(--maroon-deep);border:none;padding:11px 16px;border-radius:100px;cursor:pointer;white-space:nowrap;}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCucH3NfX2nq092ZgRiCwJXtdRz_cjft8I",authDomain:"open-qr-bd.firebaseapp.com",projectId:"open-qr-bd",storageBucket:"open-qr-bd.firebasestorage.app",messagingSenderId:"254895573910",appId:"1:254895573910:web:da5dd36a46d0fabbc6abb7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const root=document.getElementById('root');

function getSlug(){const parts=window.location.pathname.split('/').filter(Boolean);return parts[0]||'';}
function waLink(n,m){return"https://wa.me/"+n+"?text="+encodeURIComponent(m);}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(showToast._timer);showToast._timer=setTimeout(()=>t.classList.remove('show'),1800);}
function copyText(t){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>showToast("নম্বর কপি হয়েছে: "+t));}else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast("নম্বর কপি হয়েছে: "+t);}catch(e){showToast(t);}document.body.removeChild(ta);}}
function isOpenNow(sch){if(!sch)return true;const now=new Date();const day=now.getDay();const mins=now.getHours()*60+now.getMinutes();const openMins=(sch.openHour||0)*60+(sch.openMinute||0);const closeMins=(sch.closeHour||23)*60+(sch.closeMinute||59);if(sch.closedWeekday===day)return false;return mins>=openMins&&mins<closeMins;}
function isWithinHourWindow(s,e){const h=new Date().getHours();return h>=s&&h<e;}

function renderState(emoji,title,msg){
  root.innerHTML=`<div class="state-screen"><div class="emoji">${emoji}</div><h2 style="font-family:'Baloo Da 2',sans-serif;color:var(--maroon);font-size:18px;">${title}</h2><p>${msg}</p><a href="https://openqr-bd.netlify.app/">Open QR হোমপেজে যান</a></div>`;
}

function renderPage(slug,d){
  const pageUrl=window.location.origin+'/'+slug+'/';
  const phoneTel=d.phoneTel||('+880'+(d.phone||'').replace(/^0/,''));
  const whatsapp=d.whatsapp||('880'+(d.phone||'').replace(/^0/,''));
  const orderMsg=d.whatsappOrderMsg||'আসসালামু আলাইকুম, আমি জানতে চাই।';
  const bookingMsg=d.whatsappBookingMsg||'আসসালামু আলাইকুম, আমি একটি টেবিল বুক করতে চাই।';
  const sections=d.sections||[];
  const open=isOpenNow(d.schedule);
  const payments=(d.payments||[]).filter(p=>p.number);

  root.innerHTML=`
    <div class="app">
      ${(d.ticker&&d.ticker.length)?`<div class="ticker"><div class="ticker-track" id="ticker-track"></div></div>`:''}
      <div class="hero">
        <div class="hero-pattern"></div>
        <div class="hero-top">
          ${d.logoUrl?`<img class="logo-img" src="${d.logoUrl}" alt="logo" onerror="this.closest('.hero-top').innerHTML='<svg class=&quot;wheel&quot; viewBox=&quot;0 0 48 48&quot; fill=&quot;none&quot;><circle cx=&quot;24&quot; cy=&quot;24&quot; r=&quot;20&quot; stroke=&quot;%23E0A527&quot; stroke-width=&quot;2.5&quot;/><circle cx=&quot;24&quot; cy=&quot;24&quot; r=&quot;4&quot; fill=&quot;%23E0A527&quot;/><line x1=&quot;24&quot; y1=&quot;4&quot; x2=&quot;24&quot; y2=&quot;44&quot; stroke=&quot;%23E0A527&quot; stroke-width=&quot;2&quot;/><line x1=&quot;4&quot; y1=&quot;24&quot; x2=&quot;44&quot; y2=&quot;24&quot; stroke=&quot;%23E0A527&quot; stroke-width=&quot;2&quot;/><line x1=&quot;9.5&quot; y1=&quot;9.5&quot; x2=&quot;38.5&quot; y2=&quot;38.5&quot; stroke=&quot;%23E0A527&quot; stroke-width=&quot;2&quot;/><line x1=&quot;38.5&quot; y1=&quot;9.5&quot; x2=&quot;9.5&quot; y2=&quot;38.5&quot; stroke=&quot;%23E0A527&quot; stroke-width=&quot;2&quot;/></svg>'">`:`<svg class="wheel" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="20" stroke="#E0A527" stroke-width="2.5"/><circle cx="24" cy="24" r="4" fill="#E0A527"/><line x1="24" y1="4" x2="24" y2="44" stroke="#E0A527" stroke-width="2"/><line x1="4" y1="24" x2="44" y2="24" stroke="#E0A527" stroke-width="2"/><line x1="9.5" y1="9.5" x2="38.5" y2="38.5" stroke="#E0A527" stroke-width="2"/><line x1="38.5" y1="9.5" x2="9.5" y2="38.5" stroke="#E0A527" stroke-width="2"/></svg>`}
        </div>
        <div class="badge-row">${d.eyebrow?`<span class="eyebrow">${d.eyebrow}</span>`:''}<span class="status-pill ${open?'open':'closed'}"><span class="status-dot"></span>${open?'এখন খোলা':'এখন বন্ধ'}</span></div>
        <h1>${d.name||slug}</h1>
        ${d.tagline?`<div class="tagline">${d.tagline}</div>`:''}
      </div>
      <div class="info-card" id="info-card"></div>
      ${payments.length?`<div class="quickpay-card reveal" id="quickpay-card">
        <div class="quickpay-title">💳 বিল পরিশোধ করুন</div>
        <div class="quickpay-sub">নম্বরে ট্যাপ করলেই কপি হয়ে যাবে</div>
        <div class="pay-grid">${payments.map(p=>`<div class="pay-card" data-number="${p.number}"><div class="dot" style="background:${p.color||'#7A2323'};"></div><b>${p.name}</b><span>${p.number}</span></div>`).join('')}</div>
      </div>`:''}
      <div class="search-wrap"><div class="search-box"><span>🔍</span><input id="search-input" type="text" placeholder="খুঁজুন... (সেবা, ডাক্তার, পণ্য)"><button class="search-clear" id="search-clear">✕</button></div></div>
      <div class="nav-wrap"><nav class="tabs" id="nav-tabs"></nav></div>
      <div class="spacer"></div>
      <div id="sections-root"></div>
      <div class="no-results" id="no-results">😕 এই নামে কিছু পাওয়া যায়নি — অন্য কিছু লিখে দেখুন</div>
      ${(d.aboutText||(d.whyUs&&d.whyUs.length))?`<div class="section-card reveal" id="sec-about"><div class="section-title">🏪 আমাদের সম্পর্কে</div>${d.aboutText?`<div class="about-p">${d.aboutText}</div>`:''}${(d.whyUs&&d.whyUs.length)?`<div style="font-family:'Baloo Da 2',sans-serif;font-weight:700;font-size:15px;color:var(--maroon);margin:6px 0 8px;">⭐ কেন আমাদের বেছে নেবেন?</div><div class="why-grid">${d.whyUs.map(w=>`<div class="why-row"><span class="tick">✓</span>${w}</div>`).join('')}</div>`:''}</div>`:''}
      <footer>
        <div class="cta-row">${phoneTel?`<a class="cta primary" href="tel:${phoneTel}">☎️ কল করুন</a>`:''}${whatsapp?`<a class="cta secondary" href="${waLink(whatsapp,orderMsg)}" target="_blank" rel="noopener">💬 WhatsApp</a>`:''}</div>
        <div class="cta-row2">
          <button class="cta secondary" id="footer-share">📤 পেজ শেয়ার করুন</button>
          ${d.reviewUrl?`<a class="cta secondary" href="${d.reviewUrl}" target="_blank" rel="noopener">⭐ গুগলে রিভিউ দিন</a>`:''}
        </div>
        <div class="qr-box"><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&color=7A2323&bgcolor=FBF7EE&data=${encodeURIComponent(pageUrl)}" alt="QR code"><div class="qr-text"><b>টেবিলে এই QR-টাই থাকবে</b>তথ্য আপডেট হলেও এই একই QR কোড কাজ করবে</div></div>
        <div class="powered"><b>Powered by Open QR</b><br>Smart Digital Business Profile<br>🌐 Open QR</div>
      </footer>
    </div>
    <div class="fab-col">
      <button class="fab top" id="fab-top" aria-label="উপরে যান">↑</button>
      ${whatsapp?`<a class="fab wa" href="${waLink(whatsapp,orderMsg)}" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>`:''}
      ${phoneTel?`<a class="fab call" href="tel:${phoneTel}" aria-label="কল করুন">📞</a>`:''}
    </div>
    <div class="order-bar" id="order-bar">
      <div class="order-bar-info"><b id="order-count">0 আইটেম</b><span id="order-total">মোট: ৳0</span></div>
      <button id="order-send">🛒 অর্ডার পাঠান</button>
    </div>
  `;

  if(d.ticker&&d.ticker.length){const tt=document.getElementById('ticker-track');const h=d.ticker.map(t=>`<span>${t}</span>`).join('');tt.innerHTML=h+h;}

  const infoCard=document.getElementById('info-card');
  let infoHtml='';
  if(phoneTel)infoHtml+=`<a href="tel:${phoneTel}"><span class="ic">📞</span>কল করুন</a>`;
  if(whatsapp)infoHtml+=`<a href="${waLink(whatsapp,orderMsg)}" target="_blank" rel="noopener"><span class="ic">💬</span>WhatsApp</a>`;
  if(d.mapsUrl)infoHtml+=`<a href="${d.mapsUrl}" target="_blank" rel="noopener"><span class="ic">📍</span>লোকেশন</a>`;
  if(d.reviewUrl)infoHtml+=`<a href="${d.reviewUrl}" target="_blank" rel="noopener"><span class="ic">⭐</span>রিভিউ দিন</a>`;
  if(d.helpline)infoHtml+=`<a href="tel:${d.helpline}"><span class="ic">🚨</span>হেল্পলাইন</a>`;
  if(d.facebookUrl)infoHtml+=`<a href="${d.facebookUrl}" target="_blank" rel="noopener"><span class="ic">📘</span>Facebook</a>`;
  if(d.youtubeUrl)infoHtml+=`<a href="${d.youtubeUrl}" target="_blank" rel="noopener"><span class="ic">▶️</span>YouTube</a>`;
  infoCard.innerHTML=infoHtml;

  const shareBtn=document.getElementById('footer-share');
  if(shareBtn){
    shareBtn.addEventListener('click',()=>{
      if(navigator.share){ navigator.share({title:d.name||slug, text:d.tagline||'', url:pageUrl}).catch(()=>{}); }
      else { copyText(pageUrl); }
    });
  }

  const nav=document.getElementById('nav-tabs');
  const sroot=document.getElementById('sections-root');

  sections.forEach(sec=>{
    const a=document.createElement('a');a.className='tab';a.href='#'+sec.id;a.dataset.target=sec.id;a.textContent=(sec.icon||'📋')+' '+sec.title;nav.appendChild(a);
    const wrap=document.createElement('section');wrap.className='section-card reveal';wrap.id=sec.id;
    wrap.innerHTML=`<div class="section-title">${sec.icon||'📋'} ${sec.title}</div>`+(sec.items||[]).map(it=>{
      const name=(it.name||'').toString();
      const price=it.price;
      const searchKey=name.trim().toLowerCase();
      return `<div class="item" data-name="${searchKey}" data-order-name="${name}" data-order-price="${(price||'').toString().replace(/[^0-9]/g,'')}"><span class="item-check" role="checkbox" aria-checked="false"></span><span class="item-name">${name}</span>${price?`<span class="item-price">৳ ${price}</span>`:''}</div>`;
    }).join('');
    sroot.appendChild(wrap);
  });

  if(d.bestSellers&&d.bestSellers.length){
    const wrap=document.createElement('section');wrap.className='section-card reveal card-gold';
    wrap.innerHTML=`<div class="section-title">🌟 সর্বাধিক অর্ডারকৃত</div>`+d.bestSellers.map(r=>`<div class="row-flex"><span>${r.label}</span><span>${r.value}</span></div>`).join('');
    sroot.appendChild(wrap);
  }

  if(d.offers&&d.offers.length){
    const wrap=document.createElement('section');wrap.className='section-card reveal card-maroon';
    wrap.innerHTML=`<div class="section-title">🎉 আজকের বিশেষ অফার</div>`+d.offers.map(o=>{const live=o.liveWindow&&isWithinHourWindow(o.liveWindow[0],o.liveWindow[1])?'<span class="live-tag">🔥 এখন সক্রিয়</span>':'';return `<div class="row-plain">${o.text} ${live}</div>`;}).join('');
    sroot.appendChild(wrap);
  }

  if(d.schedule){
    const WEEKDAY_NAMES=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
    const sch=d.schedule;
    const rows=[];
    rows.push('🗓️ প্রতিদিন খোলা'+(sch.closedWeekday>=0?' ('+WEEKDAY_NAMES[sch.closedWeekday]+' ছাড়া)':''));
    rows.push('⏰ '+(sch.hoursShort || (String(sch.openHour||0).padStart(2,'0')+':'+String(sch.openMinute||0).padStart(2,'0')+' – '+String(sch.closeHour||0).padStart(2,'0')+':'+String(sch.closeMinute||0).padStart(2,'0'))));
    if(sch.closedWeekday>=0) rows.push('🔴 '+WEEKDAY_NAMES[sch.closedWeekday]+' সাপ্তাহিক ছুটি');
    const wrap=document.createElement('section');wrap.className='section-card reveal card-teal';
    wrap.innerHTML=`<div class="section-title">🕒 ব্যবসা পরিচালনার সময়সূচি</div>`+rows.map(r=>`<div class="row-plain">${r}</div>`).join('');
    sroot.appendChild(wrap);
  }

  if(d.staff&&d.staff.length){
    const wrap=document.createElement('section');wrap.className='section-card reveal';
    wrap.innerHTML=`<div class="section-title">👥 ${d.staffSectionLabel||'স্টাফ তালিকা'}</div>`+d.staff.map(s=>`<div class="item"><span class="item-name">${s.name}</span>${s.role?`<span class="item-price">${s.role}</span>`:''}</div>`).join('');
    sroot.appendChild(wrap);
  }

  if(d.branches&&d.branches.length){
    const wrap=document.createElement('section');wrap.className='section-card reveal';
    wrap.innerHTML=`<div class="section-title">🏢 শাখা তালিকা</div>`+d.branches.map(b=>`<div class="item" style="flex-direction:column;align-items:flex-start;gap:2px;"><span class="item-name">${b.name}</span><span style="font-size:11.5px;color:#7a6c60;">${b.address||''}${b.phone?' · '+b.phone:''}</span></div>`).join('');
    sroot.appendChild(wrap);
  }

  if(d.links&&d.links.length){
    const wrap=document.createElement('section');wrap.className='section-card reveal';
    wrap.innerHTML=`<div class="section-title">🔗 গুরুত্বপূর্ণ লিংক</div>`+d.links.map(l=>`<a class="item" style="text-decoration:none;color:inherit;" href="${l.url}" target="_blank" rel="noopener"><span class="item-name">${l.label}</span><span class="item-price">↗</span></a>`).join('');
    sroot.appendChild(wrap);
  }

  if(d.notices&&d.notices.length){
    const wrap=document.createElement('section');wrap.className='section-card reveal';
    wrap.innerHTML=`<div class="section-title">📢 নোটিশ / ঘোষণা</div>`+d.notices.map(n=>`<div class="row-plain">📌 ${n.text}${n.date?` <span style="color:#a89a8c;font-size:11px;">(${n.date})</span>`:''}</div>`).join('');
    sroot.appendChild(wrap);
  }

  if(d.reviews&&d.reviews.length){
    const wrap=document.createElement('section');wrap.className='section-card reveal';
    wrap.innerHTML=`<div class="section-title">💬 কাস্টমার রিভিউ</div>`+d.reviews.map(r=>`<div class="review-card"><div class="review-top"><span class="review-name">${r.name}</span><span class="review-stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span></div><div class="review-text">${r.text}</div></div>`).join('');
    sroot.appendChild(wrap);
  }

  if(d.bookingText){
    const wrap=document.createElement('section');wrap.className='section-card reveal';
    const bLabel = d.bookingSectionLabel||'বুকিং';
    wrap.innerHTML=`<div class="section-title">🎟️ ${bLabel}</div><div class="booking-p">${d.bookingText}</div><a class="booking-btn" href="${waLink(whatsapp,bookingMsg)}" target="_blank" rel="noopener">💬 WhatsApp-এ ${bLabel}</a>`;
    sroot.appendChild(wrap);
  }

  document.addEventListener('click',(e)=>{
    const card=e.target.closest('.pay-card');if(card){copyText(card.dataset.number);return;}
  });

  sroot.addEventListener('click',(e)=>{
    const item=e.target.closest('.item');if(!item||!item.dataset.orderName)return;
    const key=item.dataset.orderName;const price=parseInt(item.dataset.orderPrice,10)||0;const check=item.querySelector('.item-check');
    if(!check)return;
    if(cart.has(key)){cart.delete(key);check.classList.remove('checked');check.textContent='';check.setAttribute('aria-checked','false');item.classList.remove('checked');}
    else{cart.set(key,{name:key,price});check.classList.add('checked');check.textContent='✓';check.setAttribute('aria-checked','true');item.classList.add('checked');}
    updateOrderBar();
  });

  const tabs=Array.from(document.querySelectorAll('.tab'));
  function setActive(id){tabs.forEach(t=>t.classList.toggle('active',t.dataset.target===id));const activeTab=tabs.find(t=>t.dataset.target===id);if(activeTab)nav.scrollTo({left:activeTab.offsetLeft-16,behavior:'smooth'});}
  tabs.forEach(tab=>{tab.addEventListener('click',(e)=>{e.preventDefault();const id=tab.dataset.target;const target=document.getElementById(id);if(target){target.scrollIntoView({behavior:'smooth',block:'start'});setActive(id);}});});
  if(tabs.length)setActive(tabs[0].dataset.target);

  const searchInput=document.getElementById('search-input');
  if(searchInput){
    const searchClear=document.getElementById('search-clear');
    const noResults=document.getElementById('no-results');
    function runFilter(){
      const q=searchInput.value.trim().toLowerCase().replace(/\s+/g,' ');
      searchClear.classList.toggle('show',q.length>0);
      const allCards=Array.from(document.querySelectorAll('.section-card'));
      const listSections=allCards.filter(s=>s.querySelector('.item'));
      const otherCards=allCards.filter(s=>!s.querySelector('.item'));
      if(!q){
        document.querySelectorAll('.item.hidden').forEach(i=>i.classList.remove('hidden'));
        listSections.forEach(s=>s.classList.remove('hidden'));
        otherCards.forEach(s=>s.classList.remove('hidden'));
        noResults.classList.remove('show');
        return;
      }
      otherCards.forEach(s=>s.classList.add('hidden'));
      let any=false;
      listSections.forEach(sec=>{
        let match=false;
        sec.querySelectorAll('.item').forEach(item=>{
          const nameText=(item.dataset.name||item.textContent||'').toLowerCase().trim();
          const m=nameText.includes(q);
          item.classList.toggle('hidden',!m);
          if(m){match=true;any=true;}
        });
        sec.classList.toggle('hidden',!match);
      });
      noResults.classList.toggle('show',!any);
    }
    searchInput.addEventListener('input',runFilter);
    searchClear.addEventListener('click',()=>{searchInput.value='';runFilter();searchInput.focus();});
  }

  const revealObserver=new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('in');revealObserver.unobserve(entry.target);}});},{threshold:0.12});
  document.querySelectorAll('.reveal').forEach(el=>revealObserver.observe(el));

  const scrollSections=tabs.map(t=>document.getElementById(t.dataset.target)).filter(Boolean);
  if(scrollSections.length){
    const navObserver=new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting)setActive(entry.target.id);});},{rootMargin:'-90px 0px -65% 0px',threshold:0});
    scrollSections.forEach(sec=>navObserver.observe(sec));
  }

  const fabTop=document.getElementById('fab-top');
  if(fabTop){
    window.addEventListener('scroll',()=>{fabTop.classList.toggle('show',window.scrollY>500);});
    fabTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  }

  document.getElementById('order-send').addEventListener('click',()=>{
    if(cart.size===0)return;
    const lines=['আসসালামু আলাইকুম, আমি নিচের আইটেমগুলো অর্ডার করতে চাই:',''];let i=1,total=0;
    cart.forEach(it=>{lines.push(i+'. '+it.name+' — ৳'+it.price);total+=it.price;i++;});
    lines.push('');lines.push('মোট: ৳'+total);lines.push('');lines.push('(টেবিল নম্বর / ঠিকানা এখানে লিখুন)');
    window.open(waLink(whatsapp,lines.join('\n')),'_blank');
  });
}

const cart=new Map();
function updateOrderBar(){const bar=document.getElementById('order-bar');const c=document.getElementById('order-count');const t=document.getElementById('order-total');if(cart.size===0){bar.classList.remove('show');return;}let total=0;cart.forEach(it=>total+=it.price);c.textContent=cart.size+' আইটেম নির্বাচিত';t.textContent='আনুমানিক মোট: ৳'+total;bar.classList.add('show');}

const slug=getSlug();
if(!slug){renderState('🏠','সঠিক লিংক দরকার','এই পেজে সরাসরি কিছু নেই — QR কোড স্ক্যান করে বা সঠিক লিংক দিয়ে আসুন।');}
else{
  db.collection('clients').doc(slug).get().then(doc=>{
    if(!doc.exists){renderState('😕','পেজ পাওয়া যায়নি','এই লিংকে কোনো ব্যবসার তথ্য নেই। লিংকটা আবার চেক করুন।');return;}
    renderPage(slug,doc.data());
  }).catch(err=>{
    console.error(err);
    renderState('⚠️','লোড করতে সমস্যা হয়েছে','একটু পরে আবার চেষ্টা করুন।');
  });
}
</script>
</body>
</html>
