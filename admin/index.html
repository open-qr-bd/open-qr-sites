<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open QR — অ্যাডমিন প্যানেল</title>
<link rel="manifest" href="/admin/manifest.json">
<meta name="theme-color" content="#0F9D58">
<link rel="icon" href="/admin/icon.svg" type="image/svg+xml"> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#0F9D58; --green-dark:#0A6B3D; --green-deep:#073F24;
    --amber:#F5A623; --ink:#122017; --cream:#F5FAF7; --paper:#FFFFFF;
    --line:rgba(18,32,23,0.1); --shadow:0 10px 30px -14px rgba(10,107,61,0.25); --danger:#C0392B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'Hind Siliguri',sans-serif; padding:0 0 40px; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 16px; }

  header{ background:linear-gradient(150deg, var(--green), var(--green-deep)); color:#fff; padding:22px 20px; text-align:center; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; }
  header h1{ font-family:'Baloo Da 2',sans-serif; font-size:18px; }
  header button{ background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); color:#fff; padding:7px 12px; border-radius:10px; font-family:'Poppins',sans-serif; font-size:11.5px; cursor:pointer; }

  .login-wrap{ max-width:360px; margin:60px auto; padding:0 16px; }
  .login-card{ background:var(--paper); border-radius:18px; box-shadow:var(--shadow); padding:26px 22px; text-align:center; }
  .login-card h2{ font-family:'Baloo Da 2',sans-serif; color:var(--green-dark); margin-bottom:16px; font-size:19px; }
  .login-card input{ width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--cream); font-size:13.5px; margin-bottom:10px; }
  .login-card button{ width:100%; padding:13px; border-radius:12px; border:none; background:var(--green); color:#fff; font-family:'Poppins',sans-serif; font-weight:700; font-size:13.5px; cursor:pointer; }
  .login-error{ color:var(--danger); font-size:12px; margin-top:10px; display:none; }
  .login-error.show{ display:block; }

  .card{ background:var(--paper); border-radius:16px; box-shadow:var(--shadow); padding:16px; margin-bottom:14px; }
  .add-btn{ display:block; width:100%; text-align:center; padding:14px; border-radius:14px; border:none; background:var(--green); color:#fff; font-family:'Poppins',sans-serif; font-weight:700; font-size:13.5px; cursor:pointer; box-shadow:var(--shadow); margin-bottom:16px; }
  .client-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
  .client-row:last-child{ border-bottom:none; }
  .client-info b{ font-size:14px; display:block; }
  .client-info span{ font-size:11px; color:#7a8a7d; }
  .client-actions{ display:flex; gap:6px; }
  .icon-btn{ width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--cream); font-size:14px; cursor:pointer; }
  .icon-btn.danger{ color:var(--danger); }
  .empty-note{ text-align:center; color:#7a8a7d; font-size:12.5px; padding:20px; }

  .form-wrap{ display:none; }
  .form-wrap.show{ display:block; }
  .card h2{ font-family:'Baloo Da 2',sans-serif; font-size:15px; color:var(--green-dark); margin-bottom:12px; }
  .field{ margin-bottom:11px; }
  .field label{ display:block; font-size:11.5px; font-weight:600; color:#5a6b60; margin-bottom:5px; }
  .field .hint{ font-size:10px; color:#a2b0a6; margin-top:3px; }
  input[type=text], input[type=tel], input[type=url], input[type=email], input[type=password], textarea, select{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-family:'Hind Siliguri',sans-serif; font-size:13.5px; background:var(--cream); color:var(--ink);
  }
  textarea{ min-height:70px; resize:vertical; }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  .category{ border:1px dashed var(--line); border-radius:12px; padding:10px; margin-bottom:8px; position:relative; }
  .category .remove-cat{ position:absolute; top:8px; right:8px; background:#fde8e8; color:var(--danger); border:none; width:20px; height:20px; border-radius:50%; font-size:11px; cursor:pointer; }
  .add-cat-btn{ display:block; width:100%; text-align:center; padding:9px; border-radius:10px; border:1.5px dashed var(--green); color:var(--green-dark); background:none; font-family:'Poppins',sans-serif; font-size:12px; font-weight:600; cursor:pointer; margin-bottom:10px; }
  .save-btn{ width:100%; padding:14px; border-radius:14px; border:none; background:var(--green); color:#fff; font-family:'Poppins',sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .cancel-btn{ width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--paper); color:#5a6b60; font-family:'Poppins',sans-serif; font-size:13px; cursor:pointer; margin-top:8px; }
  .save-status{ text-align:center; font-size:12.5px; font-weight:600; margin-top:10px; display:none; }
  .save-status.ok{ color:var(--green-dark); display:block; }
  .save-status.err{ color:var(--danger); display:block; }
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <h2>🔐 Open QR অ্যাডমিন</h2>
    <input type="email" id="loginEmail" placeholder="ইমেইল">
    <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড">
    <button id="loginBtn">লগইন করুন</button>
    <div class="login-error" id="loginError">ইমেইল বা পাসওয়ার্ড ভুল হয়েছে</div>
  </div>
</div>

<div id="adminScreen" style="display:none;">
  <header>
    <h1>🧾 Open QR অ্যাডমিন</h1>
    <button id="logoutBtn">লগআউট</button>
  </header>

  <div class="wrap">

    <div id="listView">
      <button class="add-btn" id="showAddForm">+ নতুন ক্লায়েন্ট যোগ করুন</button>
      <div class="card">
        <h2 style="margin-bottom:10px;">📋 সব ক্লায়েন্ট</h2>
        <div id="clientList"><div class="empty-note">লোড হচ্ছে...</div></div>
      </div>
    </div>

    <div class="form-wrap" id="formView">
      <div class="card">
        <h2 id="formTitle">নতুন ক্লায়েন্ট যোগ করুন</h2>

        <div class="field">
          <label>পেজের URL নাম (একবার সেভ করার পর বদলানো যাবে না)</label>
          <input type="text" id="fSlug" placeholder="যেমন: rahim-salon">
          <div class="hint">লিংক হবে: openqr-bd.netlify.app/<span id="slugPreview">...</span>/</div>
        </div>
        <div class="field"><label>ব্যবসার নাম</label><input type="text" id="fName"></div>
        <div class="field"><label>ট্যাগলাইন</label><input type="text" id="fTagline"></div>
        <div class="field"><label>হেডারের উপরের ছোট লাইন</label><input type="text" id="fEyebrow"></div>

        <div class="field"><label>ফোন/WhatsApp নম্বর</label><input type="tel" id="fPhone" placeholder="01XXXXXXXXX"></div>
        <div class="row2">
          <div class="field"><label>বিকাশ</label><input type="tel" id="fBkash"></div>
          <div class="field"><label>নগদ</label><input type="tel" id="fNagad"></div>
        </div>
        <div class="field"><label>রকেট</label><input type="tel" id="fRocket"></div>
        <div class="field"><label>Google Maps লিংক</label><input type="url" id="fMaps"></div>
        <div class="field"><label>Google রিভিউ লিংক</label><input type="url" id="fReview"></div>
        <div class="row2">
          <div class="field"><label>খোলার সময়</label><input type="text" id="fHours" placeholder="৯টা–১০টা"></div>
          <div class="field"><label>সাপ্তাহিক ছুটি</label>
            <select id="fClosedDay">
              <option value="5">শুক্রবার</option>
              <option value="6">শনিবার</option>
              <option value="0">রবিবার</option>
              <option value="-1">ছুটি নেই</option>
            </select>
          </div>
        </div>
        <div class="field"><label>স্ক্রলিং অফার (এক লাইনে একটা)</label><textarea id="fTicker"></textarea></div>
      </div>

      <div class="card">
        <h2>📋 মেনু / সেবা</h2>
        <div id="categoriesWrap"></div>
        <button class="add-cat-btn" id="addCategoryBtn" type="button">+ ক্যাটাগরি যোগ করুন</button>
      </div>

      <div class="card">
        <h2>🏪 আমাদের সম্পর্কে</h2>
        <div class="field"><label>পরিচিতি</label><textarea id="fAbout"></textarea></div>
        <div class="field"><label>কেন বেছে নেবেন (এক লাইনে একটা)</label><textarea id="fWhyUs"></textarea></div>
      </div>

      <button class="save-btn" id="saveBtn">💾 সেভ ও পাবলিশ করুন</button>
      <button class="cancel-btn" id="cancelBtn">বাতিল করুন</button>
      <div class="save-status" id="saveStatus"></div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCucH3NfX2nq092ZgRiCwJXtdRz_cjft8I",
  authDomain: "open-qr-bd.firebaseapp.com",
  projectId: "open-qr-bd",
  storageBucket: "open-qr-bd.firebasestorage.app",
  messagingSenderId: "254895573910",
  appId: "1:254895573910:web:da5dd36a46d0fabbc6abb7"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let editingSlug = null;
let catCount = 0;

function addCategory(icon='🍽️', title='', itemsText=''){
  catCount++;
  const id = 'cat' + catCount;
  const div = document.createElement('div');
  div.className = 'category';
  div.id = id;
  div.innerHTML = `
    <button class="remove-cat" type="button" onclick="document.getElementById('${id}').remove()">✕</button>
    <div class="row2">
      <div class="field" style="flex:0 0 60px;"><label>আইকন</label><input type="text" class="cat-icon" value="${icon}"></div>
      <div class="field"><label>ক্যাটাগরির নাম</label><input type="text" class="cat-title" value="${title}"></div>
    </div>
    <div class="field"><label>আইটেম, দাম (প্রতি লাইনে একটা)</label><textarea class="cat-items">${itemsText}</textarea></div>
  `;
  document.getElementById('categoriesWrap').appendChild(div);
}
document.getElementById('addCategoryBtn').addEventListener('click', ()=>addCategory());

function resetForm(){
  editingSlug = null;
  document.getElementById('formTitle').textContent = 'নতুন ক্লায়েন্ট যোগ করুন';
  ['fSlug','fName','fTagline','fEyebrow','fPhone','fBkash','fNagad','fRocket','fMaps','fReview','fHours','fTicker','fAbout','fWhyUs'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fSlug').disabled = false;
  document.getElementById('categoriesWrap').innerHTML = '';
  catCount = 0;
  addCategory();
  document.getElementById('saveStatus').className = 'save-status';
  document.getElementById('saveStatus').textContent = '';
}

function showForm(){
  document.getElementById('listView').style.display = 'none';
  document.getElementById('formView').classList.add('show');
}
function showList(){
  document.getElementById('formView').classList.remove('show');
  document.getElementById('listView').style.display = 'block';
  loadClientList();
}

document.getElementById('showAddForm').addEventListener('click', ()=>{ resetForm(); showForm(); });
document.getElementById('cancelBtn').addEventListener('click', showList);

document.getElementById('fSlug').addEventListener('input', (e)=>{
  document.getElementById('slugPreview').textContent = e.target.value || '...';
});

function loadClientList(){
  const wrap = document.getElementById('clientList');
  wrap.innerHTML = '<div class="empty-note">লোড হচ্ছে...</div>';
  db.collection('clients').get().then(snap => {
    if(snap.empty){ wrap.innerHTML = '<div class="empty-note">এখনো কোনো ক্লায়েন্ট যোগ করা হয়নি</div>'; return; }
    wrap.innerHTML = '';
    snap.forEach(doc => {
      const d = doc.data();
      const row = document.createElement('div');
      row.className = 'client-row';
      row.innerHTML = `
        <div class="client-info"><b>${d.name||doc.id}</b><span>openqr-bd.netlify.app/${doc.id}/</span></div>
        <div class="client-actions">
          <button class="icon-btn" onclick="editClient('${doc.id}')">✏️</button>
          <a class="icon-btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;" href="https://openqr-bd.netlify.app/${doc.id}/" target="_blank">👀</a>
          <button class="icon-btn danger" onclick="deleteClient('${doc.id}')">🗑️</button>
        </div>
      `;
      wrap.appendChild(row);
    });
  }).catch(err=>{ wrap.innerHTML = '<div class="empty-note">লোড করতে সমস্যা হয়েছে</div>'; console.error(err); });
}

window.editClient = function(slug){
  db.collection('clients').doc(slug).get().then(doc => {
    if(!doc.exists) return;
    const d = doc.data();
    resetForm();
    editingSlug = slug;
    document.getElementById('formTitle').textContent = '✏️ এডিট করুন: ' + (d.name||slug);
    document.getElementById('fSlug').value = slug;
    document.getElementById('fSlug').disabled = true;
    document.getElementById('slugPreview').textContent = slug;
    document.getElementById('fName').value = d.name||'';
    document.getElementById('fTagline').value = d.tagline||'';
    document.getElementById('fEyebrow').value = d.eyebrow||'';
    document.getElementById('fPhone').value = d.phone||'';
    document.getElementById('fBkash').value = (d.payments&&d.payments[0]&&d.payments[0].number)||'';
    document.getElementById('fNagad').value = (d.payments&&d.payments[1]&&d.payments[1].number)||'';
    document.getElementById('fRocket').value = (d.payments&&d.payments[2]&&d.payments[2].number)||'';
    document.getElementById('fMaps').value = d.mapsUrl||'';
    document.getElementById('fReview').value = d.reviewUrl||'';
    document.getElementById('fHours').value = (d.schedule&&d.schedule.hoursShort)||'';
    document.getElementById('fClosedDay').value = (d.schedule&&d.schedule.closedWeekday!==undefined)?d.schedule.closedWeekday:5;
    document.getElementById('fTicker').value = (d.ticker||[]).join('\n');
    document.getElementById('fAbout').value = d.aboutText||'';
    document.getElementById('fWhyUs').value = (d.whyUs||[]).join('\n');

    document.getElementById('categoriesWrap').innerHTML = '';
    catCount = 0;
    (d.sections||[]).forEach(sec => {
      const itemsText = (sec.items||[]).map(it=>it[0]+', '+it[1]).join('\n');
      addCategory(sec.icon||'🍽️', sec.title||'', itemsText);
    });
    if(!(d.sections||[]).length) addCategory();

    showForm();
  });
};

window.deleteClient = function(slug){
  if(!confirm('আপনি কি নিশ্চিত? "'+slug+'" পেজটা মুছে ফেলা হবে এবং এটা আর ফেরত আনা যাবে না।')) return;
  db.collection('clients').doc(slug).delete().then(loadClientList);
};

document.getElementById('saveBtn').addEventListener('click', () => {
  const slug = document.getElementById('fSlug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');
  const statusEl = document.getElementById('saveStatus');
  if(!slug){ statusEl.className='save-status err'; statusEl.textContent='পেজের URL নাম দিতে হবে'; return; }

  const phone = document.getElementById('fPhone').value.trim();
  const phoneTel = '+880' + phone.replace(/^0/,'');
  const whatsapp = '880' + phone.replace(/^0/,'');

  const sections = Array.from(document.querySelectorAll('.category')).map((el,i) => {
    const icon = el.querySelector('.cat-icon').value.trim() || '🍽️';
    const title = el.querySelector('.cat-title').value.trim() || ('ক্যাটাগরি '+(i+1));
    const items = el.querySelector('.cat-items').value.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
      const parts = line.split(',');
      return [(parts[0]||'').trim(), (parts[1]||'').trim()];
    });
    return { id:'sec-cat'+i, icon, title, type:'list', items };
  }).filter(s => s.items.length);

  const data = {
    name: document.getElementById('fName').value.trim() || slug,
    tagline: document.getElementById('fTagline').value.trim(),
    eyebrow: document.getElementById('fEyebrow').value.trim(),
    phone, phoneTel, whatsapp,
    whatsappOrderMsg: 'আসসালামু আলাইকুম, আমি জানতে চাই।',
    mapsUrl: document.getElementById('fMaps').value.trim(),
    reviewUrl: document.getElementById('fReview').value.trim(),
    schedule: {
      openHour:9, openMinute:0, closeHour:21, closeMinute:0,
      closedWeekday: Number(document.getElementById('fClosedDay').value),
      hoursShort: document.getElementById('fHours').value.trim()
    },
    ticker: document.getElementById('fTicker').value.split('\n').map(s=>s.trim()).filter(Boolean),
    payments: [
      { name:'বিকাশ', number: document.getElementById('fBkash').value.trim() || phone, color:'#E2136E' },
      { name:'নগদ', number: document.getElementById('fNagad').value.trim() || phone, color:'#F6921E' },
      { name:'রকেট', number: document.getElementById('fRocket').value.trim() || phone, color:'#8B2E8F' }
    ],
    sections,
    aboutText: document.getElementById('fAbout').value.trim(),
    whyUs: document.getElementById('fWhyUs').value.split('\n').map(s=>s.trim()).filter(Boolean),
    updatedAt: new Date().toISOString()
  };

  db.collection('clients').doc(slug).set(data).then(() => {
    statusEl.className = 'save-status ok';
    statusEl.textContent = '✅ সফলভাবে সেভ ও পাবলিশ হয়েছে! লিংক: openqr-bd.netlify.app/'+slug+'/';
    setTimeout(showList, 1600);
  }).catch(err => {
    statusEl.className = 'save-status err';
    statusEl.textContent = 'সেভ করতে সমস্যা হয়েছে: ' + err.message;
  });
});

document.getElementById('loginBtn').addEventListener('click', () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  document.getElementById('loginError').classList.remove('show');
  auth.signInWithEmailAndPassword(email, pass).catch(err => {
    document.getElementById('loginError').textContent = 'ইমেইল বা পাসওয়ার্ড ভুল: ' + err.message;
    document.getElementById('loginError').classList.add('show');
  });
});
document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    showList();
  } else {
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('adminScreen').style.display = 'none';
  }
});
</script>
</body>
</html>
