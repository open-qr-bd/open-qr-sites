<style>

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--ink);font-family:'Hind Siliguri',sans-serif;display:flex;justify-content:center;padding:0 0 60px;}
.app{width:100%;max-width:430px;background:var(--cream);min-height:100vh;position:relative;}
.ticker{background:var(--maroon-deep);color:var(--gold);overflow:hidden;white-space:nowrap;padding:7px 0;font-family:'Poppins',sans-serif;font-size:11px;font-weight:500;}
.ticker-track{display:inline-block;padding-left:100%;animation:ticker-scroll 22s linear infinite;}
.ticker-track span{margin-right:36px;}
@keyframes ticker-scroll{from{transform:translateX(0);}to{transform:translateX(-100%);}}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease;}

.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;}
.wheel{width:38px;height:38px;flex:none;animation:spin 7s linear infinite;}

.eyebrow{font-family:'Poppins',sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);background:rgba(255,255,255,0.08);padding:5px 10px;border-radius:100px;border:1px solid rgba(255,255,255,0.16);}

বিফ পিজ্জা (রেগুলার)","৫৪০"],["ভেজিটেবল পিজ্জা","৪২০"]]},{id:"sec-cold",icon:"🥤",title:"ঠান্ডা পানীয়",type:"list",items:[["কোক ২৫০ মি.লি.","৪০"],["স্প্রাইট","৪০"],["ফান্টা","৪০"],["মিনারেল ওয়াটার","৩০"],["ফ্রেশ অরেঞ্জ জুস","১২০"],["ম্যাঙ্গো জুস","১২০"]]},{id:"sec-hot",icon:"☕",title:"গরম পানীয়",type:"list",items:[["দুধ চা","৩০"],["লাল চা","২৫"],["কফি","৮০"],["ক্যাপুচিনো","১৬০"]]},{id:"sec-dessert",icon:"🍰",title:"ডেজার্ট",type:"list",items:[["ফিরনি","৯০"],["মিষ্টি দই","১২০"],["আইসক্রিম","১০০"],["ব্রাউনি","১৫০"]]},{id:"sec-best",icon:"🌟",title:"সর্বাধিক অর্ডারকৃত খাবার",type:"gold",rows:[["🥇 কাচ্চি বিরিয়ানি","৳ ২৮০"],["🥈 চিকেন বার্গার","৳ ২২০"],["🥉 কোল্ড ড্রিংকস","৳ ৪০"]]},{id:"sec-offer",icon:"🎉",title:"আজকের বিশেষ অফার",type:"maroon",rows:[{text:"⭐ কাচ্চি বিরিয়ানিতে ১০% ছাড়"},{text:"⭐ ২টি চিকেন বার্গার কিনলে ১টি কোল্ড ড্রিংক ফ্রি"},{text:"⭐ বিকেল ৪টা–৬টা: সব কফিতে ২০% ছাড়",liveWindow:[16,18]}]},{id:"sec-schedule",icon:"🕒",title:"ব্যবসা পরিচালনার সময়সূচি",type:"teal",rows:[{text:"🗓️ শনিবার – বৃহস্পতিবার"},{text:"⏰ সকাল ৮:০০ – রাত ৯:০০"},{text:"🔴 শুক্রবার সাপ্তাহিক ছুটি"}]},{id:"sec-reviews",icon:"💬",title:"কাস্টমার রিভিউ",type:"reviews",reviews:[{name:"রাকিব হাসান",stars:5,text:"কাচ্চি বিরিয়ানি অসাধারণ! বাসায় দ্রুত ডেলিভারিও পেয়েছি।"},{name:"সুমাইয়া আক্তার",stars:5,text:"পরিবেশ পরিচ্ছন্ন, খাবারও তাজা। পরিবার নিয়ে খেতে ভালো লাগে।"},{name:"ইমরান খান",stars:4,text:"দাম সাশ্রয়ী, স্বাদও ভালো। বিফ স্টেকটা বিশেষভাবে ভালো লেগেছে।"}]},{id:"sec-booking",icon:"🎟️",title:"টেবিল বুকিং",type:"booking",text:"পরিবার, বন্ধু বা বিশেষ অনুষ্ঠানের জন্য আগে থেকে টেবিল বুক করে রাখতে পারেন। নিচের বাটনে চাপ দিলে WhatsApp-এ সরাসরি আমাদের কাছে বার্তা চলে যাবে।"},{id:"sec-payment",icon:"💳",title:"বিল পরিশোধ করুন",type:"payment",text:"আপনার সুবিধামতো নিচের যেকোনো মাধ্যমে নিরাপদে বিল পরিশোধ করুন। নম্বরে ট্যাপ করলেই কপি হয়ে যাবে।"},{id:"sec-about",icon:"🏪",title:"আমাদের সম্পর্কে",type:"about",paragraphs:["নূর রেস্টুরেন্টে আপনাকে স্বাগতম। আমরা বিশ্বাস করি, সুস্বাদু খাবারের পাশাপাশি পরিচ্ছন্ন পরিবেশ ও আন্তরিক সেবাই একজন গ্রাহকের সন্তুষ্টির মূল চাবিকাঠি।","আমাদের মেনুতে রয়েছে কাচ্চি বিরিয়ানি, তেহারি, গ্রিল, বার্গার, পিজ্জা, বিভিন্ন দেশীয় ও আন্তর্জাতিক খাবার, ঠান্ডা পানীয় এবং সুস্বাদু ডেজার্ট।"],whyUs:["তাজা ও স্বাস্থ্যসম্মত খাবার","পরিচ্ছন্ন ও আরামদায়ক পরিবেশ","দক্ষ ও আন্তরিক সেবা","সাশ্রয়ী মূল্য","দ্রুত অর্ডার পরিবেশন","পারিবারিক পরিবেশ","হোম ডেলিভারি সুবিধা","বিকাশ, নগদ, রকেট ও কার্ডে পেমেন্ট সুবিধা"]}]};
function waLink(n,m){return"https://wa.me/"+n+"?text="+encodeURIComponent(m);}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(showToast._timer);showToast._timer=setTimeout(()=>t.classList.remove('show'),1800);}
function copyText(t){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>showToast("নম্বর কপি হয়েছে: "+t));}else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast("নম্বর কপি হয়েছে: "+t);}catch(e){showToast(t);}document.body.removeChild(ta);}}
function isOpenNow(){const now=new Date();const day=now.getDay();const mins=now.getHours()*60+now.getMinutes();const openMins=CONFIG.schedule.openHour*60+CONFIG.schedule.openMinute;const closeMins=CONFIG.schedule.closeHour*60+CONFIG.schedule.closeMinute;if(day===CONFIG.schedule.closedWeekday)return false;return mins>=openMins&&mins<closeMins;}
function isWithinHourWindow(s,e){const h=new Date().getHours();return h>=s&&h<e;}
function renderSection(sec){const wrap=document.createElement('section');wrap.className='section-card reveal';wrap.id=sec.id;
if(sec.type==='list'){wrap.innerHTML=`<div class="section-title">${sec.icon} ${sec.title}</div>`+sec.items.map(([name,price])=>`<div class="item" data-name="${name.toLowerCase()}" data-order-name="${name}" data-order-price="${price}"><span class="item-check" role="checkbox" aria-checked="false"></span><span class="item-name">${name}</span><span class="item-price">৳ ${price}</span></div>`).join('');}
if(sec.type==='gold'){wrap.classList.add('card-gold');wrap.innerHTML=`<div class="section-title">${sec.icon} ${sec.title}</div>`+sec.rows.map(([l,v])=>`<div class="row-flex"><span>${l}</span><span>${v}</span></div>`).join('');}
if(sec.type==='maroon'){wrap.classList.add('card-maroon');wrap.innerHTML=`<div class="section-title">${sec.icon} ${sec.title}</div>`+sec.rows.map(r=>{const live=r.liveWindow&&isWithinHourWindow(r.liveWindow[0],r.liveWindow[1])?'<span class="live-tag">🔥 এখন সক্রিয়</span>':'';return `<div class="row-plain">${r.text} ${live}</div>`;}).join('');}
if(sec.type==='teal'){wrap.classList.add('card-teal');wrap.innerHTML=`<div class="section-title">${sec.icon} ${sec.title}</div>`+sec.rows.map(r=>`<div class="row-plain">${r.text}</div>`).join('');}
if(sec.type==='reviews'){wrap.innerHTML=`<div class="section-title">${sec.icon} ${sec.title}</div>`+sec.reviews.map(r=>`<div class="review-card"><div class="review-top"><span class="review-name">${r.name}</span><span class="review-stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span></div><div class="review-text">${r.text}</div></div>`).join('');}
if(sec.type==='booking'){wrap.innerHTML=`<div class="section-title">${sec.icon} ${sec.title}</div><div class="booking-p">${sec.text}</div><a class="booking-btn" href="${waLink(CONFIG.contact.whatsapp,CONFIG.contact.whatsappBookingMsg)}" target="_blank" rel="noopener">💬 WhatsApp-এ টেবিল বুক করুন</a>`;}
if(sec.type==='payment'){wrap.innerHTML=`<div class="section-title">${sec.icon} ${sec.title}</div><div class="about-p" style="margin-bottom:2px;">${sec.text}</div><div class="pay-grid">${CONFIG.payments.map(p=>`<div class="pay-card" data-number="${p.number}"><div class="dot" style="background:${p.color};"></div><b>${p.name}</b><span>${p.number}</span></div>`).join('')}</div><div class="pay-hint">নম্বরে ট্যাপ করলে কপি হয়ে যাবে</div>`;}
if(sec.type==='about'){wrap.innerHTML=`<div class="section-title">${sec.icon} ${sec.title}</div>${sec.paragraphs.map(p=>`<div class="about-p">${p}</div>`).join('')}<div style="font-family:'Baloo Da 2',sans-serif;font-weight:700;font-size:15px;color:var(--maroon);margin:14px 0 8px;">⭐ কেন আমাদের বেছে নেবেন?</div><div class="why-grid">${sec.whyUs.map(w=>`<div class="why-row"><span class="tick">✓</span>${w}</div>`).join('')}</div>`;}
return wrap;}
function build(){const tickerTrack=document.getElementById('ticker-track');const tickerHtml=CONFIG.ticker.map(t=>`<span>${t}</span>`).join('');tickerTrack.innerHTML=tickerHtml+tickerHtml;
document.getElementById('hero-eyebrow').textContent=CONFIG.brand.eyebrow;document.getElementById('hero-name').textContent=CONFIG.brand.name;document.getElementById('hero-tagline').textContent=CONFIG.brand.tagline;
const open=isOpenNow();const pill=document.getElementById('status-pill');pill.className='status-pill '+(open?'open':'closed');pill.innerHTML=`<span class="status-dot"></span>${open?'এখন খোলা':'এখন বন্ধ'}`;
const infoCard=document.getElementById('info-card');infoCard.innerHTML=`<a href="tel:${CONFIG.contact.phoneTel}"><span class="ic">📞</span>কল করুন</a><a href="${waLink(CONFIG.contact.whatsapp,CONFIG.contact.whatsappOrderMsg)}" target="_blank" rel="noopener"><span class="ic">💬</span>WhatsApp</a><a href="${CONFIG.contact.mapsUrl}" target="_blank" rel="noopener"><span class="ic">📍</span>লোকেশন</a><a href="${CONFIG.contact.googleReviewUrl}" target="_blank" rel="noopener"><span class="ic">⭐</span>রিভিউ দিন</a>`;
const nav=document.getElementById('nav-tabs');const root=document.getElementById('sections-root');CONFIG.sections.forEach(sec=>{const a=document.createElement('a');a.className='tab';a.href='#'+sec.id;a.dataset.target=sec.id;a.textContent=sec.icon+' '+sec.title;nav.appendChild(a);root.appendChild(renderSection(sec));});
document.getElementById('footer-call').href='tel:'+CONFIG.contact.phoneTel;document.getElementById('footer-whatsapp').href=waLink(CONFIG.contact.whatsapp,CONFIG.contact.whatsappOrderMsg);document.getElementById('footer-whatsapp').target='_blank';document.getElementById('footer-review').href=CONFIG.contact.googleReviewUrl;document.getElementById('qr-img').src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&color=7A2323&bgcolor=FBF7EE&data='+encodeURIComponent(CONFIG.contact.pageUrl);
document.getElementById('fab-call').href='tel:'+CONFIG.contact.phoneTel;document.getElementById('fab-wa').href=waLink(CONFIG.contact.whatsapp,CONFIG.contact.whatsappOrderMsg);
document.getElementById('footer-share').addEventListener('click',()=>{if(navigator.share){navigator.share({title:CONFIG.brand.name,text:CONFIG.brand.tagline,url:CONFIG.contact.pageUrl}).catch(()=>{});}else{copyText(CONFIG.contact.pageUrl);}});
root.addEventListener('click',(e)=>{const card=e.target.closest('.pay-card');if(card)copyText(card.dataset.number);});
const searchInput=document.getElementById('search-input');const searchClear=document.getElementById('search-clear');const noResults=document.getElementById('no-results');const listSections=Array.from(document.querySelectorAll('.section-card')).filter(s=>s.querySelector('.item'));
function runFilter(){const q=searchInput.value.trim().toLowerCase();searchClear.classList.toggle('show',q.length>0);if(!q){document.querySelectorAll('.item.hidden').forEach(i=>i.classList.remove('hidden'));listSections.forEach(s=>s.classList.remove('hidden'));noResults.classList.remove('show');return;}let anyVisible=false;listSections.forEach(sec=>{let sectionHasMatch=false;sec.querySelectorAll('.item').forEach(item=>{const match=item.dataset.name.includes(q);item.classList.toggle('hidden',!match);if(match){sectionHasMatch=true;anyVisible=true;}});sec.classList.toggle('hidden',!sectionHasMatch);});noResults.classList.toggle('show',!anyVisible);}
searchInput.addEventListener('input',runFilter);searchClear.addEventListener('click',()=>{searchInput.value='';runFilter();searchInput.focus();});
const tabs=Array.from(document.querySelectorAll('.tab'));const navWrap=document.getElementById('nav-tabs');
function setActive(id){tabs.forEach(t=>t.classList.toggle('active',t.dataset.target===id));const activeTab=tabs.find(t=>t.dataset.target===id);if(activeTab)navWrap.scrollTo({left:activeTab.offsetLeft-16,behavior:'smooth'});}
tabs.forEach(tab=>{tab.addEventListener('click',(e)=>{e.preventDefault();const id=tab.dataset.target;const target=document.getElementById(id);if(target){target.scrollIntoView({behavior:'smooth',block:'start'});setActive(id);}});});
const sections=tabs.map(t=>document.getElementById(t.dataset.target)).filter(Boolean);const navObserver=new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting)setActive(entry.target.id);});},{rootMargin:'-90px 0px -65% 0px',threshold:0});sections.forEach(sec=>navObserver.observe(sec));if(tabs.length)setActive(tabs[0].dataset.target);
const revealObserver=new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('in');revealObserver.unobserve(entry.target);}});},{threshold:0.12});document.querySelectorAll('.reveal').forEach(el=>revealObserver.observe(el));
const fabTop=document.getElementById('fab-top');window.addEventListener('scroll',()=>{fabTop.classList.toggle('show',window.scrollY>500);});fabTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

const cart=new Map();
function updateOrderBar(){const bar=document.getElementById('order-bar');const countEl=document.getElementById('order-count');const totalEl=document.getElementById('order-total');const n=cart.size;if(n===0){bar.classList.remove('show');return;}let total=0;cart.forEach(it=>total+=it.price);countEl.textContent=n+' আইটেম নির্বাচিত';totalEl.textContent='আনুমানিক মোট: ৳'+total;bar.classList.add('show');}
root.addEventListener('click',(e)=>{const item=e.target.closest('.item');if(!item||!item.dataset.orderName)return;const key=item.dataset.orderName;const price=parseInt(item.dataset.orderPrice,10)||0;const check=item.querySelector('.item-check');if(cart.has(key)){cart.delete(key);check.classList.remove('checked');check.textContent='';check.setAttribute('aria-checked','false');item.classList.remove('checked');}else{cart.set(key,{name:key,price:price});check.classList.add('checked');check.textContent='✓';check.setAttribute('aria-checked','true');item.classList.add('checked');}updateOrderBar();});
document.getElementById('order-send').addEventListener('click',()=>{if(cart.size===0)return;const lines=['আসসালামু আলাইকুম, আমি নিচের আইটেমগুলো অর্ডার করতে চাই:',''];let i=1;let total=0;cart.forEach(it=>{lines.push(i+'. '+it.name+' — ৳'+it.price);total+=it.price;i++;});lines.push('');lines.push('মোট: ৳'+total);lines.push('');lines.push('(টেবিল নম্বর / ঠিকানা এখানে লিখুন)');const msg=lines.join('\n');window.open(waLink(CONFIG.contact.whatsapp,msg),'_blank');});
}
build();
</script>
</body>
</html>
